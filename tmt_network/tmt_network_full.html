// ===== 飞船系统 =====
const SHIP_SPEED = 400;
// 航迹火焰色：最新（贴近飞船）红 → 橙 → 白黄 → 最老端蓝色焰尾（更接近真实火焰的燃烧层次）
const flameColor = d3.interpolateRgbBasis(["#4da3ff", "#fff3c4", "#ffd166", "#ff8c42", "#ff4d4d"]);
let shipGroup = null;
let shipState = { planet: null, angle: 0, flying: false, x: 0, y: 0, trail: [] };
let orbitTimer = null;
let trailGroup = null;
let idleTimer = null;
let idleFirst = true;
let idleDuration = 90;
let idleInterval = 30;
let autoNavOn = true;
let captainVoiceOn = false;
let shipOn = true;  // 飞船总开关：关闭后移除飞船/航迹/气泡，页面完全静态

// 停止飞船及所有相关动态：绕行、idle巡航、航迹、飞船元素、气泡
function stopShip() {
  shipOn = false;
  if (orbitTimer) { orbitTimer.stop(); orbitTimer = null; }
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  if (shipGroup) { shipGroup.interrupt(); shipGroup.remove(); shipGroup = null; }
  if (trailGroup) { trailGroup.remove(); trailGroup = null; }
  shipState = { planet: null, angle: 0, flying: false, x: 0, y: 0, trail: [] };
  document.getElementById("captainVoice").classList.remove("visible");
}

// 恢复飞船：清状态，飞船下次飞行时重建（flyToPlanet 内 createShip）
function startShip() {
  shipOn = true;
  shipState = { planet: null, angle: 0, flying: false, x: 0, y: 0, trail: [] };
  idleFirst = true;
  resetIdleTimer();
}

function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  if (!autoNavOn) return;
  idleTimer = setTimeout(idleFly, idleFirst ? idleDuration * 1000 : idleInterval * 1000);
}

// idle 巡航：隐藏除日志外的所有 UI（沉浸体验），hide=false 恢复
function setCruiseUI(hide) {
  ["info", "search", "sliders", "stats", "legend", "tooltip", "topnav"].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.classList.toggle("cruise-hidden", hide);
  });
}

// 取消聚焦/筛选状态：idle 自动飞行前清理，恢复全量显示
function clearFocusState() {
  if (!lastFocusedNode && !activeFilterGroup) return;
  node.attr("opacity", d => d.rating === "S" || d.rating === "A" ? 1 : 0.35).attr("fill", d => getNodeFill(d));
  link.attr("display", null).attr("opacity", 1);
  label.attr("opacity", 1);
  d3.select("#searchInput").property("value", "");
  currentCode = null;
  lastFocusedNode = null;
  focusDirection = 'up';
  activeFilterGroup = null;
  legendExpanded = false;
  updateLegend();
}

function idleFly() {
  if (!shipOn) return;
  clearFocusState();
  setCruiseUI(true);  // 隐藏除日志外的所有 UI，进入沉浸巡航
  // 随机选下一颗星球：排除当前所在星球，避免原地打转
  var cur = shipState.planet ? shipState.planet.id : null;
  var candidates = NODES.filter(function(d) { return d.type === 'a' && d.id !== cur; });
  if (candidates.length === 0) candidates = NODES.filter(function(d) { return d.type === 'a'; });
  var pick = candidates[Math.floor(Math.random() * candidates.length)];
  flyToPlanet(pick, true);
  var dx = pick.x - shipState.x, dy = pick.y - shipState.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var dur = Math.max(300, dist / SHIP_SPEED * 1000);
  svg.transition().duration(dur).ease(d3.easeLinear)
    .call(zoom.transform, d3.zoomIdentity.translate(W/2 - pick.x * 1.5, H/2 - pick.y * 1.5).scale(1.5));
  idleFirst = false;
  resetIdleTimer();
}

function startOrbit() {
  if (orbitTimer) orbitTimer.stop();
  var frame = 0;
  orbitTimer = d3.timer(function() {
    if (!shipState.planet || shipState.flying) return;
    if ((frame++ & 1) !== 0) return;  // 隔帧更新：CPU减半，角度补偿保持视觉角速度不变
    shipState.angle += 0.04;  // 补偿：每2帧0.04 ≈ 原每帧0.02
    var r = (nodeRadii[shipState.planet.id] || 14) + 15;
    shipState.x = shipState.planet.x + r * Math.cos(shipState.angle);
    shipState.y = shipState.planet.y + r * Math.sin(shipState.angle);
    shipGroup.attr("transform", `translate(${shipState.x},${shipState.y}) rotate(${shipState.angle * 180 / Math.PI + 90})`);
    // 航迹从船尾（局部 -6,0，机头朝 angle+90°）喷出
    shipState.trail.push({x: shipState.x + 6 * Math.sin(shipState.angle), y: shipState.y - 6 * Math.cos(shipState.angle)});
    if (shipState.trail.length > 24) shipState.trail.shift();
    var dots = trailGroup.selectAll("circle").data(shipState.trail);
    dots.enter().append("circle").attr("fill", "#ff8c42");
    dots.merge(dots)
      .attr("fill", function(d, i) { return flameColor(i / shipState.trail.length); })
      .attr("cx", function(d) { return d.x + (Math.random()-0.5)*1.6; })
      .attr("cy", function(d) { return d.y + (Math.random()-0.5)*1.6; })
      .attr("r", function(d, i) { return (i / shipState.trail.length) * 3; })
      .attr("opacity", function(d, i) { return (i / shipState.trail.length) * 0.5; });
    dots.exit().remove();
  });
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// 强调文字（变色/变字号的 span）与前后文字之间加空格分隔；标点两侧不留空格
function padHighlight(s) {
  return s
    .replace(/<span[^>]*>[^<]*<\/span>/g, function(m) { return ' ' + m + ' '; })
    .replace(/\s+([，。、！？；：——])/g, '$1')
    .replace(/([，。、！？；：——])\s+/g, '$1')
    .replace(/ +/g, ' ')
    .trim();
}

// 确保字符串以句号结尾（忽略末尾的 HTML 标签和 {r} 占位符），用于拼接追加句前补标点
function ensurePeriod(s) {
  if (/\{r\}$/.test(s)) return s; // {r} 会替换为自带句号的放松句，无需补
  var plain = s.replace(/<[^>]*>$/g, "");
  if (/[。！？!?]$/.test(plain)) return s;
  return s + "。";
}

// T历时间：2026-08-01 09:38 → T历26H01年I38日
// 年=年份后两位，月=1-12→A-L，日=两位数；时=1-24→A-X，分=两位数
function tDateStr() {
  var d = new Date();
  var y = d.getFullYear() % 100;
  var mo = d.getMonth() + 1;
  var day = d.getDate();
  var h = d.getHours();
  var mi = d.getMinutes();
  var moLetter = String.fromCharCode(64 + mo);
  var hh = h === 0 ? 24 : h;
  var hLetter = String.fromCharCode(64 + hh);
  var p2 = function(n){ return (n < 10 ? "0" : "") + n; };
  return "T历" + p2(y) + moLetter + p2(day) + "年" + hLetter + p2(mi) + "日";
}

// 上下游邻居（downstream=true 取下游客户，false 取上游供应商）
function getNeighbors(target, downstream) {
  var list = [];
  EDGES.forEach(function(e) {
    var s = typeof e.source === "string" ? e.source : e.source.id;
    var t = typeof e.target === "string" ? e.target : e.target.id;
    if (downstream && s === target.id && list.indexOf(t) === -1) list.push(t);
    if (!downstream && t === target.id && list.indexOf(s) === -1) list.push(s);
  });
  return list;
}

    addons.push(supText);
  }
  // 追加句插到 {r} 之前（无 {r} 时直接拼到末尾并补句号）
  if (addons.length) {
    var extra = " " + addons.join(" ");
    var ri = story.indexOf("{r}");
    if (ri !== -1) story = story.slice(0, ri) + extra + story.slice(ri);
    else story = ensurePeriod(story) + extra;
  }
  // 放松句：50% 概率出现；出现时前面加换行，与主体/供应故事分开
  if (Math.random() < 0.5) {
    var relax = pickRandom(relaxDetails);
    if (!/[。！？!?]$/.test(relax)) relax += "。";
    story = story.split("{r}").join('<br><span style="color:#e6d5a8;font-style:italic">' + relax + '</span>');
  } else {
    story = story.replace(/，?\s*不过在此之前，让我们去放松一下，?\{r\}$/, "。");
    story = story.replace(/。\{r\}$/, "。");
    story = story.replace(/[！？!?]\{r\}$/, function(m){ return m.charAt(0); });
    story = story.replace(/，\{r\}$/, "。");
    story = story.replace(/\{r\}$/, "。");
  }
  return padHighlight(story);
}

function showCaptainVoice(target, full) {
  if (!target) return;
  if (!captainVoiceOn) return;
  var cv = document.getElementById("captainVoice");
  var body = cv.querySelector(".cv-body");
  var rating = target.rating || "C";
  var chains = target.chains || [];
  var chainStr = "";
  var chainTint = function(v){ return '<span style="color:#a371f7">' + v + '</span>'; };
  if (chains.length === 1) chainStr = "位于" + chainTint(chains[0]) + "星链的";
  else if (chains.length === 2) chainStr = "横跨" + chainTint(chains[0]) + "和" + chainTint(chains[1]) + "星链的";
  else if (chains.length === 3) chainStr = "连接" + chains.map(chainTint).join("、") + "3大星链的";
  else if (chains.length > 3) chainStr = "连接" + chains.slice(0, 3).map(chainTint).join("、") + "等" + chains.length + "大星链的";
  var ratingColor = {S:"#f0c040", A:"#f0883e", B:"#58a6ff", C:"#8b949e"}[rating] || "#8b949e";
  var levelStr = '<span style="color:' + ratingColor + ';font-weight:bold">' + rating + '级</span>行星——';
  var nameStr = '<span style="color:#d2a861">' + (target.group || "未知产业") + '</span>座<span class="cv-name">' + target.id + '</span>星';
  var navStr = target.code ? "，行星导航码<span style=\"color:#f0c040;font-weight:bold\">" + target.code + "</span>" : "";
  var desc = (NODE_DESC && NODE_DESC[target.id]) ? NODE_DESC[target.id] : "";
  if (desc) desc += "。";
  var comment = pickRandom(ratingComments[rating] || ratingComments["C"]);
  var arrival = pickRandom(arrivalTemplates);
  var story = buildMerchantStory(target);
  var closingLine = pickRandom(captainClosings);
  var headLine = padHighlight(arrival + levelStr + chainStr + nameStr + navStr + '。' + desc + comment);
  // 日期并入标题行，节约纵向空间
  cv.querySelector(".cv-header").innerHTML = '📖 舰长日志 <span style="color:#8b949e;font-weight:normal;letter-spacing:1px;font-size:9px">' + tDateStr() + '</span>';

  var html = '<div style="line-height:1.5">' + headLine + '</div>'
    + '<div style="line-height:1.5;margin-top:2px">' + story + '</div>'
    + '<div class="cv-closing">—— ' + closingLine + '</div>';
  // 触发来源决定显示：full=true（idle自动飞行）完整日志；其余折叠为等待圆点
  if (!full) {
    cv._fullHtml = html;
    cv.classList.add("collapsed");
    if (body._twTimer) clearInterval(body._twTimer);
    body.innerHTML = "";
  } else {
    cv._fullHtml = null;
    cv.classList.remove("collapsed");
    typewriteBody(body, html);
  }
  cv.classList.add("visible");
  updateBubblePosition();
}

function typewriteBody(el, html) {
  if (el._twTimer) clearInterval(el._twTimer);
  var visible = '';
  var i = 0;
  el.innerHTML = '<span class="tw-cursor">|</span>';
  var timer = setInterval(function() {
    if (i >= html.length) { clearInterval(timer); el.innerHTML = html; updateBubblePosition(); return; }
    if (html[i] === '<') {
      var end = html.indexOf('>', i);
      if (end === -1) end = html.length;
      visible += html.substring(i, end + 1);
      i = end + 1;
    } else {
      visible += html[i];
      i++;
    }
    el.innerHTML = visible + '<span class="tw-cursor">|</span>';
    updateBubblePosition();  // 打字中高度增长，逐字重新居中定位
  }, 30);
  el._twTimer = timer;
}

function updateBubblePosition() {
  var cv = document.getElementById("captainVoice");
  if (!cv.classList.contains("visible")) return;
  if (!shipState.planet) return;
  var tf = d3.zoomTransform(svg.node());
  // 气泡与箭头整体固定：箭头尖端位于星球中心向左偏移一个轨道半径的位置（轨道圆左侧），气泡右边缘在其左侧 14px
  var px = tf.applyX(shipState.planet.x);
  var py = tf.applyY(shipState.planet.y);
  // 轨道半径是数据坐标，乘以缩放系数 tf.k 换算成屏幕距离，缩放画面时定位点才不会跑
  var orbitR = ((nodeRadii[shipState.planet.id] || 14) + 15) * tf.k;
  cv.style.left = "auto";
  cv.style.right = (W - px + orbitR + 14) + "px";
  cv.style.top = (py - cv.offsetHeight / 2) + "px";  // 始终以星球为中心居中
  cv.style.bottom = "auto";
  cv.style.transform = "none";
}

function createShip() {
  trailGroup = g2.append("g").attr("class", "trail-group");
  shipGroup = g2.append("g").attr("class", "ship-group").style("opacity", 0);
  shipGroup.append("path")
    .attr("d", "M-8,-6 L8,0 L-8,6 L-3,0 Z")
    .attr("fill", "#f0c040")
    .attr("stroke", "#b8860b")
    .attr("stroke-width", 1.5);
}

function flyToPlanet(target, full) {
  if (!target || !shipOn) return;
  if (!shipGroup) createShip();
  shipGroup.interrupt();
  if (orbitTimer) { orbitTimer.stop(); orbitTimer = null; }
  document.getElementById("captainVoice").classList.remove("visible");
  shipState.flying = true;
  shipGroup.style("opacity", 1);

  const orbitR = (nodeRadii[target.id] || 14) + 15;
  const entryAngle = Math.atan2(shipState.y - target.y, shipState.x - target.x);
  const entryX = target.x + orbitR * Math.cos(entryAngle);
  const entryY = target.y + orbitR * Math.sin(entryAngle);

  const dx = entryX - shipState.x;
  const dy = entryY - shipState.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const duration = Math.max(300, dist / SHIP_SPEED * 1000);
  const flightAngle = Math.atan2(dy, dx) * 180 / Math.PI;

  var sx = shipState.x, sy = shipState.y;
  shipGroup.transition().duration(duration).ease(d3.easeLinear)
    .attrTween("transform", function() {
      return function(t) {
        var px = sx + dx * t, py = sy + dy * t;
        // 航迹从船尾（局部 -6,0，机头朝 flightAngle）喷出
        var rad = flightAngle * Math.PI / 180;
        shipState.trail.push({x: px - 6 * Math.cos(rad), y: py - 6 * Math.sin(rad)});
        if (shipState.trail.length > 24) shipState.trail.shift();
        var dots = trailGroup.selectAll("circle").data(shipState.trail);
        dots.enter().append("circle").attr("fill", "#ff8c42");
        dots.merge(dots)
          .attr("fill", function(d, i) { return flameColor(i / shipState.trail.length); })
          .attr("cx", function(d) { return d.x + (Math.random()-0.5)*1.6; })
          .attr("cy", function(d) { return d.y + (Math.random()-0.5)*1.6; })
          .attr("r", function(d, i) { return (i / shipState.trail.length) * 3; })
          .attr("opacity", function(d, i) { return (i / shipState.trail.length) * 0.5; });
        dots.exit().remove();
        return `translate(${px},${py}) rotate(${flightAngle})`;
      };
    })
    .on("end", function() {
      // idle 巡航到达后继续隐藏 UI，直到用户交互退出巡航
      shipState.planet = target;
      shipState.angle = entryAngle;
      shipState.x = entryX;
      shipState.y = entryY;
      shipState.flying = false;
      startOrbit();
      showCaptainVoice(target, full);
    });
}

d3.select("#nodeCount").text(`节点: ${NODES.length} (A股${NODES.filter(d=>d.type==='a').length}+海外${NODES.filter(d=>d.type==='o').length}+非上市${NODES.filter(d=>d.type==='n').length})`);

// 初始全景视野：自动缩放到能容纳全部节点
function fitView(duration){
  if(!NODES.length)return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  NODES.forEach(d=>{
    const r=nodeRadii[d.id]||14;
    x0=Math.min(x0,d.x-r);y0=Math.min(y0,d.y-r);
    x1=Math.max(x1,d.x+r);y1=Math.max(y1,d.y+r);
  });
  const pad=50;
  const bw=x1-x0+pad*2,bh=y1-y0+pad*2;
  const s=Math.max(0.3,Math.min(1,Math.min(W/bw,H/bh)));
  const tx=W/2-s*(x0+x1)/2,ty=H/2-s*(y0+y1)/2;
  svg.transition().duration(duration||800).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(s));
}

// 舰长室联动：飞船 off → 其余全禁；自动航行 off → 两个滑块禁

}
