// ===== 飞船系统 =====
const SHIP_SPEED = 400;
let shipGroup = null;
let shipState = { planet: null, angle: 0, flying: false, x: 0, y: 0, trail: [] };
let orbitTimer = null;
let trailGroup = null;
let idleTimer = null;
let idleFirst = true;
let idleDuration = 90;
let idleInterval = 30;
let autoNavOn = true;
let captainVoiceOn = false;

function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  if (!autoNavOn) return;
  idleTimer = setTimeout(idleFly, idleFirst ? idleDuration * 1000 : idleInterval * 1000);
}

function idleFly() {
  var candidates = NODES.filter(function(d) { return d.type === 'a'; });
  if (candidates.length === 0) candidates = NODES;
  var pick = candidates[Math.floor(Math.random() * candidates.length)];
  flyToPlanet(pick);
  var dx = pick.x - shipState.x, dy = pick.y - shipState.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var dur = Math.max(300, dist / SHIP_SPEED * 1000);
  svg.transition().duration(dur).ease(d3.easeLinear)
    .call(zoom.transform, d3.zoomIdentity.translate(W/2 - pick.x * 1.5, H/2 - pick.y * 1.5).scale(1.5));
  idleFirst = false;
  resetIdleTimer();
}

function startOrbit() {
  if (orbitTimer) orbitTimer.stop();
  orbitTimer = d3.timer(function() {
    if (!shipState.planet || shipState.flying) return;
    shipState.trail.push({x: shipState.x, y: shipState.y});
    if (shipState.trail.length > 40) shipState.trail.shift();
    shipState.angle += 0.04;
    var r = (nodeRadii[shipState.planet.id] || 14) + 15;
    shipState.x = shipState.planet.x + r * Math.cos(shipState.angle);
    shipState.y = shipState.planet.y + r * Math.sin(shipState.angle);
    shipGroup.attr("transform", `translate(${shipState.x},${shipState.y}) rotate(${shipState.angle * 180 / Math.PI + 90})`);
    var dots = trailGroup.selectAll("circle").data(shipState.trail);
    dots.enter().append("circle").attr("fill", "#f0c040");
    dots.merge(dots)
      .attr("cx", function(d) { return d.x; })
      .attr("cy", function(d) { return d.y; })
      .attr("r", function(d, i) { return (i / shipState.trail.length) * 3; })
      .attr("opacity", function(d, i) { return (i / shipState.trail.length) * 0.5; });
    dots.exit().remove();
    updateBubblePosition();
  });
}

function showCaptainVoice(target) {
  if (!target) return;
  if (!captainVoiceOn) return;
  var cv = document.getElementById("captainVoice");
  var body = cv.querySelector(".cv-body");
  var idx = target.code || "";
  var desc = (NODE_DESC && NODE_DESC[target.id]) ? NODE_DESC[target.id] : "";
  var products = target.products && target.products.length ? target.products.join("、") : "";
  var rating = target.rating || "";
  var ratingLabel = {S:"S级核心枢纽",A:"A级明星行星",B:"B级潜力新星",C:"C级探索星球"}[rating] || (rating+"级行星");
  var ratingFlavors = {
    S: ["这可是银河系里数得上号的重镇——","放眼整个星域都排得上号的重量级行星——","不必多说，这颗星球的名字本身就是招牌——"],
    A: ["一颗热热闹闹的繁华星球，","生意相当红火的一颗行星，","航道上商船络绎不绝的活跃星球，"],
    B: ["一颗值得留意的新兴行星，","星图上新标记的有趣目的地，","正在快速发展中的潜力星球，"],
    C: ["一颗小而美的特色星球，","不太起眼但有自己独特定位的小众行星，","星图边缘的一颗低调星球，"]
  };
  var pool = ratingFlavors[rating] || ratingFlavors["C"];
  var ratingFlavor = pool[Math.floor(Math.random() * pool.length)];

  // 下游客户
  var customers = [];
  EDGES.forEach(function(e) {
    var s = typeof e.source === "string" ? e.source : e.source.id;
    if (s === target.id) {
      var t = typeof e.target === "string" ? e.target : e.target.id;
      if (customers.indexOf(t) === -1) customers.push(t);
    }
  });

  // 产业链
  var chains = target.chains && target.chains.length ? target.chains.slice(0, 3) : [];

  var html = '舰长，我们刚刚降落在 <span class="cv-name">' + ratingLabel + ' ' + target.id + '</span> 星球上';
  if (idx) html += '，行星编号 <span style="color:#f0c040">' + idx + '</span>';
  html += '。';
  if (ratingFlavor) html += ratingFlavor;
  if (target.group) {
    var gt = groupTemplates[Math.floor(Math.random() * groupTemplates.length)];
    html += gt.replace('{g}', target.group) + ' ';
  }
  if (desc) html += desc + '。';
  if (products) {
    var pt = productTemplates[Math.floor(Math.random() * productTemplates.length)];
    html += ' ' + pt.replace('{p}', products);
  }
  if (customers.length) {
    var topCust = customers.slice(0, 4);
    var more = customers.length > 4 ? ' 等' + customers.length + '家' : '';
    var ct = customerTemplates[Math.floor(Math.random() * customerTemplates.length)];
    html += ' ' + ct.replace('{c}', topCust.join('、')).replace('{more}', more);
  }
  if (chains.length) {
    var pool2 = chainTemplates[rating] || chainTemplates["C"];
    var sentence = pool2[Math.floor(Math.random() * pool2.length)];
    var chainStr = chains.join('、');
    html += ' ' + sentence.replace('{ch}', chainStr);
    var inv = inviteTemplates[Math.floor(Math.random() * inviteTemplates.length)];
    html += ' ' + inv;
  }

  var closingLine = captainClosings[Math.floor(Math.random() * captainClosings.length)];
  html += '<br><span style="color:#f0c040;font-style:italic">—— ' + closingLine + '</span>';

  typewriteBody(body, html);

  cv.classList.add("visible");
  updateBubblePosition();
}

function typewriteBody(el, html) {
  if (el._twTimer) clearInterval(el._twTimer);
  var visible = '';
  var i = 0;
  el.innerHTML = '<span class="tw-cursor">|</span>';
  var timer = setInterval(function() {
    if (i >= html.length) { clearInterval(timer); el.innerHTML = html; return; }
    if (html[i] === '<') {
      var end = html.indexOf('>', i);
      if (end === -1) end = html.length;
      visible += html.substring(i, end + 1);
      i = end + 1;
    } else {
      visible += html[i];
      i++;
    }
    el.innerHTML = visible + '<span class="tw-cursor">|</span>';
  }, 30);
  el._twTimer = timer;
}

function updateBubblePosition() {
  var cv = document.getElementById("captainVoice");
  if (!cv.classList.contains("visible")) return;
  if (!shipState.planet) return;
  var tf = d3.zoomTransform(svg.node());
  var px = tf.applyX(shipState.planet.x);
  var py = tf.applyY(shipState.planet.y);
  cv.style.left = (px - 420) + "px";
  cv.style.top = (py - cv.offsetHeight / 2) + "px";
  cv.style.bottom = "auto";
  cv.style.transform = "none";
}

    .attr("stroke", "#b8860b")
    .attr("stroke-width", 1.5);
  shipGroup.append("path")
    .attr("d", "M-3,-4 L-12,0 L-3,4 Z")
    .attr("fill", "#ff6b35")
    .attr("opacity", 0.8);
}

function flyToPlanet(target) {
  if (!target) return;
  if (!shipGroup) createShip();
  shipGroup.interrupt();
  if (orbitTimer) { orbitTimer.stop(); orbitTimer = null; }
  document.getElementById("captainVoice").classList.remove("visible");
  shipState.flying = true;
  shipGroup.style("opacity", 1);

  const orbitR = (nodeRadii[target.id] || 14) + 15;
  const entryAngle = Math.atan2(shipState.y - target.y, shipState.x - target.x);
  const entryX = target.x + orbitR * Math.cos(entryAngle);
  const entryY = target.y + orbitR * Math.sin(entryAngle);

  const dx = entryX - shipState.x;
  const dy = entryY - shipState.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const duration = Math.max(300, dist / SHIP_SPEED * 1000);
  const flightAngle = Math.atan2(dy, dx) * 180 / Math.PI;

  var sx = shipState.x, sy = shipState.y;
  shipGroup.transition().duration(duration).ease(d3.easeLinear)
    .attrTween("transform", function() {
      return function(t) {
        var px = sx + dx * t, py = sy + dy * t;
        shipState.trail.push({x: px, y: py});
        if (shipState.trail.length > 40) shipState.trail.shift();
        var dots = trailGroup.selectAll("circle").data(shipState.trail);
        dots.enter().append("circle").attr("fill", "#f0c040");
        dots.merge(dots)
          .attr("cx", function(d) { return d.x; })
          .attr("cy", function(d) { return d.y; })
          .attr("r", function(d, i) { return (i / shipState.trail.length) * 3; })
          .attr("opacity", function(d, i) { return (i / shipState.trail.length) * 0.5; });
        dots.exit().remove();
        return `translate(${px},${py}) rotate(${flightAngle})`;
      };
    })
    .on("end", function() {
      shipState.planet = target;
      shipState.angle = entryAngle;
      shipState.x = entryX;
      shipState.y = entryY;
      shipState.flying = false;
      startOrbit();
      showCaptainVoice(target);
    });
}

// 初始全景视野：自动缩放到能容纳全部节点
function fitView(duration){
  if(!NODES.length)return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  NODES.forEach(d=>{
    const r=nodeRadii[d.id]||14;
    x0=Math.min(x0,d.x-r);y0=Math.min(y0,d.y-r);
    x1=Math.max(x1,d.x+r);y1=Math.max(y1,d.y+r);
  });
  const pad=50;
  const bw=x1-x0+pad*2,bh=y1-y0+pad*2;
  const s=Math.max(0.3,Math.min(1,Math.min(W/bw,H/bh)));
  const tx=W/2-s*(x0+x1)/2,ty=H/2-s*(y0+y1)/2;
  svg.transition().duration(duration||800).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(s));
}
